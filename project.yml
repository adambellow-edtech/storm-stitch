name: StormStitch
options:
  bundleIdPrefix: com.adambellow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  StormStitch:
    type: application
    platform: iOS
    sources:
      - path: StormStitch
    info:
      path: StormStitch/Info.plist
      properties:
        CFBundleDisplayName: Storm Stitch
        # Without these, XcodeGen writes 1.0 (1) into the plist and the build settings below are ignored.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleURLName: com.adambellow.stormstitch
            CFBundleURLSchemes:
              - stormstitch
        UIAppFonts:
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
          - NunitoSans-Regular.ttf
          - NunitoSans-Bold.ttf
          - NunitoSans-ExtraBold.ttf
    entitlements:
      path: StormStitch/StormStitch.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adambellow.stormstitch
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8Z679P8QFB
